    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let timerInterval;
        let selectedProductName = "";
        let receiptAttached = false;

        function openShop() {
            document.getElementById("start-screen").classList.add("hidden");
            document.getElementById("shop-screen").classList.remove("hidden");
        }

        function selectProduct(name) {
            selectedProductName = name;
            receiptAttached = false;
            document.getElementById("upload-label").innerText = "🖼️ Chek rasmini biriktirish (Tanlash)";
            document.getElementById("payment-modal").classList.remove("hidden");
            startTimer(20 * 60);
        }

        function backToShop() {
            clearInterval(timerInterval);
            document.getElementById("payment-modal").classList.add("hidden");
            document.getElementById("status-modal").classList.add("hidden");
            document.getElementById("shop-screen").classList.remove("hidden");
        }

        function startTimer(duration) {
            let timer = duration, minutes, seconds;
            clearInterval(timerInterval);
            timerInterval = setInterval(function () {
                minutes = parseInt(timer / 60, 10);
                seconds = parseInt(timer % 60, 10);

                minutes = minutes < 10 ? "0" + minutes : minutes;
                seconds = seconds < 10 ? "0" + seconds : seconds;

                document.getElementById("timer-display").innerText = minutes + ":" + seconds;

                if (--timer < 0) {
                    clearInterval(timerInterval);
                    alert("To'lov vaqti tugadi!");
                    backToShop();
                }
            }, 1000);
        }

        function copyCard() {
            navigator.clipboard.writeText("8802801263275391");
            alert("Karta raqami nusxalandi!");
        }

        function openClickApp() {
            // Telegram ichida xavfsiz ochilishi uchun Click veb-havolasi ishlatiladi
            window.open("https://my.click.uz/services/pay?service_id=12531&merchant_id=18432&amount=25000&card_num=8802801263275391", "_blank");
        }

        function handleImageUpload(event) {
            if (event.target.files && event.target.files[0]) {
                receiptAttached = true;
                document.getElementById("upload-label").innerText = "✅ Chek rasmi biriktirildi!";
            }
        }

        function confirmPayment() {
            saveOrder(selectedProductName, "⏳ Kutilmoqda");
            document.getElementById("payment-modal").classList.add("hidden");
            document.getElementById("status-modal").classList.remove("hidden");
        }

        function openAdmin() {
            let text = encodeURIComponent("Salom! Men (" + selectedProductName + ") uchun to'lov qildim, mana chek. Iltimos yaxshi tekshirib ko'ring!");
            window.open("https://t.me/BE127BOTADMIN?text=" + text, "_blank");
        }

        /* TARIX VA LOCALSTORAGE */
        function saveOrder(productName, status) {
            let orders = JSON.parse(localStorage.getItem("zynex_orders")) || [];
            orders.unshift({
                id: Math.floor(1000 + Math.random() * 9000),
                title: productName,
                price: "25,000 so'm",
                status: status
            });
            localStorage.setItem("zynex_orders", JSON.stringify(orders));
        }

        function openHistoryModal() {
            let historyList = document.getElementById("history-list");
            let orders = JSON.parse(localStorage.getItem("zynex_orders")) || [];

            if (orders.length === 0) {
                historyList.innerHTML = "<p style='font-size: 12px; color: #94a3b8; margin: 20px 0;'>Sizda hali buyurtmalar mavjud emas.</p>";
            } else {
                historyList.innerHTML = "";
                orders.forEach(order => {
                    historyList.innerHTML += `
                        <div class="order-item">
                            <div style="display: flex; justify-content: space-between; margin-bottom: 6px;">
                                <span style="color: #38bdf8; font-size: 13px; font-weight: 700;">${order.title}</span>
                                <span class="status-pending">${order.status}</span>
                            </div>
                            <div style="font-size: 11px; color: #94a3b8; margin-bottom: 8px;">
                                ID: #${order.id} | Narx: ${order.price}
                            </div>
                            <button onclick="openAdminWithID('${order.title}', ${order.id})" style="width: 100%; background: #243044; color: #38bdf8; border: none; padding: 8px; border-radius: 10px; font-size: 12px; font-weight: 700; cursor: pointer;">
                                💬 Admin bilan bog'lanish va chek yuborish
                            </button>
                        </div>
                    `;
                });
            }

            document.getElementById("history-modal").classList.remove("hidden");
        }

        function openAdminWithID(title, id) {
            let text = encodeURIComponent("Salom! Men to'lov qildim, mana chek:\nBot: " + title + "\nBuyurtma ID: #" + id + "\nIltimos yaxshi tekshirib ko'ring!");
            window.open("https://t.me/BE127BOTADMIN?text=" + text, "_blank");
        }

        function closeHistoryModal() {
            document.getElementById("history-modal").classList.add("hidden");
        }
    </script>
